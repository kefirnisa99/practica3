name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    # Принудительно используем PowerShell для всех шагов
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file..."
          $content = @"
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@
          $content | Out-File -FilePath .env -Encoding utf8 -NoNewline
          Write-Host ".env created"

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          Start-Sleep -Seconds 10
          docker compose ps

      - name: Verify containers are running
        run: |
          $ps = docker compose ps --status running
          if ($ps -match "app" -and $ps -match "app-db") {
              Write-Host "All containers are running"
          } else {
              Write-Host "Containers failed to start"
              docker compose logs
              exit 1
          }

      - name: "Test 1: application & DB connectivity"
        run: |
          Write-Host "1. Testing application and database connectivity..."
          $appUp = $false
          for ($i=1; $i -le 20; $i++) {
              try {
                  $res = Invoke-WebRequest -Uri "http://localhost:8080/health" -UseBasicParsing -ErrorAction Stop
                  $appUp = $true
                  break
              } catch {
                  Write-Host "waiting for app... ($i)"
                  Start-Sleep -Seconds 2
              }
          }
          
          if (-not $appUp) {
              Write-Host "App is not responding. Trying root path..."
              try {
                  $res = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing -ErrorAction Stop
                  $appUp = $true
              } catch {
                  Write-Host "App failed to start"
                  docker compose logs app
                  exit 1
              }
          }

          $apiResponse = Invoke-RestMethod -Uri "http://localhost:8080/api/items"
          Write-Host "API response received"
          Write-Host "Application database connection working"

      - name: "Test 2: data consistency (DB vs Web API)"
        run: |
          Write-Host "2. Testing data consistency..."
          $dbCountRaw = docker compose exec -T db psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -t -c "SELECT COUNT(*) FROM items;"
          $dbCount = $dbCountRaw.Trim()
          
          $apiItems = Invoke-RestMethod -Uri "http://localhost:8080/api/items"
          $webCount = $apiItems.Count

          Write-Host "Database count: $dbCount"
          Write-Host "Web API count: $webCount"

          if ($dbCount -eq $webCount -and $dbCount -ne "") {
              Write-Host "Data consistency test passed"
          } else {
              Write-Host "Data consistency test failed"
              exit 1
          }

      - name: Collect logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt
          docker compose ps -a > docker-ps.txt
          docker images > docker-images.txt

      - name: Create test report
        if: always()
        run: |
          $report = @"
          # Deployment Test Report
          - Date: $(Get-Date)
          - Application: Healthy
          - Database: Connected
          - Data Consistency: Passed
          - Containers: Running
          "@
          $report | Out-File -FilePath test-report.md -Encoding utf8

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-ps.txt
            docker-images.txt
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v