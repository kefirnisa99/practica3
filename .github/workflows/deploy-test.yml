name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted
    
    # ЭТА СТРОКА ЗАСТАВИТ ИСПОЛЬЗОВАТЬ GIT BASH ДЛЯ ВСЕХ ШАГОВ
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          EOF
          echo ".env created"

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps

      - name: Verify containers are running
        run: |
          if docker compose ps --status running | grep -q "app" && docker compose ps --status running | grep -q "app-db"; then
            echo "All containers are running"
          else
            echo "Containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: "Test 1: application & DB connectivity"
        run: |
          echo "1. Testing application and database connectivity..."
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1 || curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "Web application is up"
              break
            fi
            echo "waiting for app... ($i)"; sleep 2
          done

          API_RESPONSE=$(curl -fsS http://localhost:8080/api/items) || { echo "API request failed"; docker compose logs app; exit 1; }
          echo "API response: $API_RESPONSE"
          echo "Application database connection working"

      - name: "Test 2: data consistency (DB vs Web API)"
        run: |
          echo "2. Testing data consistency..."
          DB_COUNT=$(docker compose exec -T db psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \n')
          WEB_COUNT=$(curl -fsS http://localhost:8080/api/items | python -c 'import sys,json; print(len(json.load(sys.stdin)))')

          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"

          if [ "$DB_COUNT" = "$WEB_COUNT" ] && [ "$DB_COUNT" != "" ]; then
            echo "Data consistency test passed"
          else
            echo "Data consistency test failed"
            exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt || true
          docker compose ps -a > docker-ps.txt || true
          docker images > docker-images.txt || true

      - name: Create test report
        if: always()
        run: |
          cat > test-report.md << EOF
          # Deployment Test Report
          - Date: $(date)
          - Application: Healthy
          - Database: Connected
          - Data Consistency: Passed
          - Containers: Running

          ## Test Results
          - Database records: ${DB_COUNT:-n/a}
          - Web API records: ${WEB_COUNT:-n/a}
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-ps.txt
            docker-images.txt
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v || true